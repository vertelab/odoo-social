dashboard:
  key: content_approver
  name: "Content Approver"
  description: "Approval queue and policy compliance overview."
  icon: fa-check-double
  category: Social
  auto_refresh: 300000
  cache_ttl: 300

metrics:
  - key: social.pending_approvals
    label: "Pending Approvals"
    source_type: model
    model: social_marketing.post
    field: id
    aggregation: count
    unit: integer
    domain:
      - [approval_state, "=", pending_approval]

  - key: social.compliance_pass_rate
    label: "Compliance Pass Rate"
    source_type: service
    service_model: dashboard.source.social.compliance
    service_method: get_pass_rate
    unit: percentage

  - key: social.compliance_rejected
    label: "Compliance Rejections"
    source_type: service
    service_model: dashboard.source.social.compliance
    service_method: get_rejected_today

  - key: social.approval_queue
    label: "Approval Queue"
    source_type: service
    service_model: dashboard.source.social.approval_queue
    service_method: get_data
    kanban:
      state_field: approval_state
      state_colors:
        pending_approval: "#ffc107"
      state_icons:
        pending_approval: fa-clock
      card_title_field: name
      card_subtitle_field: plan
      card_body_fields:
        - approval_state
      card_actions:
        - name: open_post
          label: Open Post
          icon: fa-external-link
          action: ir.actions.act_window
          params:
            res_model: social_marketing.post

charts:
  - key: kpi_pending
    type: kpi
    metric: social.pending_approvals
    label: "Pending Approvals"
    layout: {x: 0, y: 0, w: 3, h: 2}

  - key: kpi_pass_rate
    type: kpi
    metric: social.compliance_pass_rate
    label: "Compliance Pass Rate"
    layout: {x: 3, y: 0, w: 3, h: 2}

  - key: kanban_approval_queue
    type: kanban
    metric: social.approval_queue
    label: "Approval Queue"
    layout: {x: 0, y: 2, w: 12, h: 5}

alerts:
  - key: compliance_rejection
    label: Compliance Rejection
    metric: social.compliance_rejected
    condition: "value > 0"
    severity: warning
    trigger_type: cron
    schedule: "0 */4 * * *"
    cooldown: 3600
    channels: [notification]
